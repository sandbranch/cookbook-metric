# US ingredient and kitchen names -> what a Nordic (European) kitchen calls them.
#
# Each line is:  "new name" = ["old name", "another old name", ...]
#
# Matching ignores case and treats a space and a hyphen as the same
# ("all purpose" = "all-purpose"). Only whole words match. Longer phrases
# always win over shorter ones, so the order of lines does not matter.
# Give singular and plural as separate lines when both are common.
#
# Your own additions and overrides go in ~/.config/cookbook-metric/names.toml
# in the same format; they win over this file. To stop a rename from here,
# map the name to itself there, e.g.  "shrimp" = ["shrimp"].
#
# Preference: the word a Nordic cook would use, then British English.

# ---- Flour, grains, starch
"wheat flour" = ["all-purpose flour", "all-purpose white flour", "AP flour", "plain flour", "cake flour", "pastry flour"]
"strong wheat flour" = ["bread flour"]
"wholemeal flour" = ["whole wheat flour", "whole-wheat flour", "wholewheat flour"]
"self-raising flour" = ["self-rising flour", "self-risen flour"]
"corn starch" = ["cornstarch"]
"rolled oats" = ["old-fashioned oats", "old-fashioned rolled oats"]
"semolina" = ["cream of wheat"]
"sweetcorn" = ["corn kernels", "whole kernel corn"]

